[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openbuds-manager"
version = "0.1.0"
description = "Administrador de auriculares Bluetooth para Linux — Redmi Buds 6 Lite"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Alex"},
]
keywords = ["bluetooth", "bluez", "pipewire", "wireplumber", "redmi-buds", "linux"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "click>=8.1",
    "dbus-next>=0.2",
    "rich>=13.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
    "pygobject>=3.46",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
openbuds = "backend.cli:main"

[project.urls]
Repository = "https://github.com/alexdev/openbuds-manager"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "frontend*", "profiles*", "plugins*", "benchmark*", "ob_logging*", "utils*"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
